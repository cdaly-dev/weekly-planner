<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>
      <span class="title-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img" focusable="false">
          <circle cx="12" cy="12" r="6.8"></circle>
          <path d="M3.5 4.5v8.2M6.1 4.5v8.2M3.5 8.6h2.6M6.1 13.5v6"></path>
          <path d="M17.4 4.5c1.6 0 2.9 1.3 2.9 2.9v10.7M20.3 4.5v13.6"></path>
        </svg>
      </span>
      Weekly Meal Planner
    </h1>
    <p class="subtitle">Plan your family's dinners for the week</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-button active" data-tab="calendar" role="tab" aria-selected="true">Weekly Calendar</button>
    <button class="tab-button" data-tab="shopping" role="tab" aria-selected="false">Shopping List</button>
    <button class="tab-button" data-tab="recipes" role="tab" aria-selected="false">My Recipes</button>
    <button class="tab-button" data-tab="add-recipe" role="tab" aria-selected="false">Add a Recipe</button>
  </nav>

  <main>
    <!-- WEEKLY CALENDAR TAB -->
    <section id="calendar" class="tab-panel active">
      <div class="week-nav">
        <button id="prevWeek" class="btn btn-secondary">&#8592; Previous Week</button>
        <h2 id="weekLabel">This Week</h2>
        <button id="nextWeek" class="btn btn-secondary">Next Week &#8594;</button>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <!-- SHOPPING LIST TAB -->
    <section id="shopping" class="tab-panel">
      <div class="week-nav">
        <button id="shoppingPrevWeek" class="btn btn-secondary">&#8592; Previous Week</button>
        <h2 id="shoppingWeekLabel">Shopping List</h2>
        <button id="shoppingNextWeek" class="btn btn-secondary">Next Week &#8594;</button>
      </div>
      <p class="shopping-help">Tap an item to mark it as not needed.</p>
      <ul id="shoppingList" class="shopping-list"></ul>
    </section>

    <!-- RECIPE LIBRARY TAB -->
    <section id="recipes" class="tab-panel">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search recipes by name or ingredient...">
        <select id="categoryFilter">
          <option value="">All categories</option>
        </select>
        <button type="button" id="exportRecipes" class="btn btn-secondary">Export JSON</button>
        <button type="button" id="importRecipes" class="btn btn-secondary">Import JSON</button>
        <input type="file" id="importRecipesFile" accept="application/json" hidden>
      </div>

      <div id="recipeList" class="recipe-list"></div>
    </section>

    <!-- ADD / EDIT RECIPE TAB -->
    <section id="add-recipe" class="tab-panel">
      <h2 id="formTitle">Add a New Dinner Recipe</h2>
      <form id="recipeForm">
        <input type="hidden" id="recipeId">

        <label for="recipeName">Recipe name</label>
        <input type="text" id="recipeName" required placeholder="e.g. Spaghetti Bolognese">

        <label for="recipeCategory">Category</label>
        <select id="recipeCategory" required>
          <option value="">Select a category</option>
          <option value="Meat">Meat</option>
          <option value="Fish">Fish</option>
          <option value="Vegetarian">Vegetarian</option>
          <option value="Pasta">Pasta</option>
          <option value="Other">Other</option>
        </select>

        <label>Ingredients (metric measurements, e.g. grams, millilitres, kilograms)</label>
        <div id="ingredientRows" class="ingredient-rows"></div>
        <button type="button" id="addIngredientRow" class="btn btn-secondary">+ Add ingredient</button>

        <label for="recipeMethod">Method</label>
        <textarea id="recipeMethod" rows="8" required placeholder="Describe each step, one per line..."></textarea>

        <label for="recipeRating">Rating</label>
        <select id="recipeRating">
          <option value="0">No rating</option>
          <option value="1">1 star</option>
          <option value="2">2 stars</option>
          <option value="3">3 stars</option>
          <option value="4">4 stars</option>
          <option value="5">5 stars</option>
        </select>

        <label for="recipeNotes">Notes</label>
        <textarea id="recipeNotes" rows="4" placeholder="Add your personal notes for this recipe..."></textarea>

        <p id="formError" class="form-error" role="alert"></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Recipe</button>
          <button type="button" id="cancelEdit" class="btn btn-secondary" style="display:none;">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <!-- RECIPE DETAIL MODAL -->
  <div id="recipeModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="closeModal" aria-label="Close">&times;</button>
      <h2 id="modalTitle"></h2>
      <p class="modal-category" id="modalCategory"></p>
      <p class="modal-rating" id="modalRating"></p>
      <h3>Ingredients</h3>
      <ul id="modalIngredients"></ul>
      <h3>Method</h3>
      <ol id="modalMethod"></ol>
      <h3>Notes</h3>
      <p id="modalNotes" class="modal-notes"></p>
      <div class="modal-actions">
        <button id="modalEdit" class="btn btn-primary">Edit</button>
        <button id="modalDelete" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- DAY PICKER MODAL -->
  <div id="dayPickerModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="closeDayPicker" aria-label="Close">&times;</button>
      <h2 id="dayPickerTitle">Choose a recipe</h2>
      <input type="text" id="dayPickerSearch" placeholder="Search recipes...">
      <div id="dayPickerList" class="recipe-list compact"></div>
    </div>
  </div>

  <!-- CONFIRM DIALOG -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content confirm-content">
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmYes" class="btn btn-danger">Yes, delete</button>
        <button id="confirmNo" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
